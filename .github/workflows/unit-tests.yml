name: Unit tests

on:
  pull_request:
    branches: [develop]

permissions: { contents: read }

concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (Karma, headless Chrome)
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress
