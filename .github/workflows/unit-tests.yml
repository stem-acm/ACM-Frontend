name: Unit tests

on:
  pull_request:
    branches: [develop]

permissions: { contents: read }

concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (Karma, headless Chrome)
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      # develop may not have the lcov reporter yet: run it with the PR's Karma setup.
      - name: Copy Karma setup from PR into develop
        run: cp pr/karma.conf.js pr/angular.json develop/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            pr/package-lock.json
            develop/package-lock.json

      - name: Coverage of develop
        working-directory: develop
        run: |
          npm ci --legacy-peer-deps
          npm test -- --watch=false --browsers=ChromeHeadless --no-progress --code-coverage

      - name: Coverage of PR
        working-directory: pr
        run: |
          npm ci --legacy-peer-deps
          npm test -- --watch=false --browsers=ChromeHeadless --no-progress --code-coverage

      - name: Compare line coverage (fail on a drop of 1 point or more)
        run: |
          line_pct() {
            local files
            files=$(find "$1/coverage" -name lcov.info)
            if [ -z "$files" ]; then
              echo "::error::No lcov.info found under $1/coverage" >&2
              exit 1
            fi
            # shellcheck disable=SC2086
            awk -F: '/^LH:/ { lh += $2 } /^LF:/ { lf += $2 }
              END { if (lf == 0) { print "0.00" } else { printf "%.2f\n", lh / lf * 100 } }' $files
          }
          DEVELOP_PCT=$(line_pct develop)
          PR_PCT=$(line_pct pr)
          echo "Line coverage develop: ${DEVELOP_PCT} %"
          echo "Line coverage PR:      ${PR_PCT} %"
          # Compare in hundredths of a point to avoid floating-point rounding errors.
          DROP=$(awk -v d="$DEVELOP_PCT" -v p="$PR_PCT" \
            'BEGIN { printf "%d\n", int(d * 100 + 0.5) - int(p * 100 + 0.5) }')
          echo "Drop: $(awk -v x="$DROP" 'BEGIN { printf "%.2f", x / 100 }') points (blocks at 1.00)"
          if [ "$DROP" -ge 100 ]; then
            echo "::error::Line coverage drops from ${DEVELOP_PCT} % (develop) to ${PR_PCT} % (PR): 1.00 point or more."
            exit 1
          fi
