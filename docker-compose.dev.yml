services:
  acm-frontend-dev:
    container_name: acm-frontend-dev

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - '4200:4200'

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: 'true'

    command: npm run start -- --host 0.0.0.0 --poll=2000

    stdin_open: true
    tty: true

    restart: unless-stopped
