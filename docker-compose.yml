services:
  acm-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: acm-frontend:latest
    container_name: acm-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    # Optional: limit resources in production
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
