server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /index.html { add_header Cache-Control "no-cache" always; }
  location /assets/i18n/ { add_header Cache-Control "no-cache" always; }
  location ~* \.(?:js|css|woff2?|ttf)$ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location ~* \.(?:map|json|png|jpg|jpeg|gif|svg|ico|webp|pdf)$ { try_files $uri =404; add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri/ /index.html; }
}
