<div
  class="fixed top-0 w-screen h-screen border z-20 bg-gray-700/50 flex justify-center items-center"
>
  <div class="bg-white p-4 rounded-lg">
    <h1 class="text-2xl text-center m-2">Membership Card</h1>
    <div class="max-h-[70dvh] overflow-auto">
      <div id="badgeSectionToPrint" class="border border-gray-200 rounded p-px">
        @for (page of memberPages; track $index) {
          <div class="badge-print-page">
            @for (item of page; track item.registrationNumber) {
              <app-member-badge [member]="item" [checkData]="checkData" />
            }
          </div>
        }
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <input type="checkbox" id="stamp" [(ngModel)]="checkData.stamp" />
        <label for="stamp">View stamp</label>
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="signature" [(ngModel)]="checkData.signature" />
        <label for="signature">View signature</label>
      </div>
    </div>

    <div class="flex gap-2 justify-end pt-3">
      <button
        z-button
        zType="outline"
        type="button"
        (click)="close()"
        class="acm-btn acm-btn--outline text-gray-900 bg-gray-300 hover:bg-gray-200 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 inline-flex items-center cursor-pointer"
      >
        Close
      </button>
      <button
        z-button
        type="button"
        (click)="print()"
        class="acm-btn acm-btn--primary text-white bg-primary hover:bg-primary/90 focus:ring-4 focus:outline-none focus:ring-primary/20 font-medium rounded-lg text-sm px-5 py-2.5 inline-flex items-center cursor-pointer"
      >
        Print
      </button>
    </div>
  </div>
</div>
