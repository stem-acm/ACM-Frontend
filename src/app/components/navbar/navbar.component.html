<nav class="acm-navbar" aria-label="Main navigation">
  <div class="acm-navbar-inner">
    <a routerLink="/" class="acm-brand" aria-label="American Corner Mahajanga home"
      ><app-acm-logo
    /></a>
    <app-flex-menus
      class="acm-nav-links"
      [mobileOpen]="mobileMenuOpen"
      (click)="mobileMenuOpen = false"
    />
    <div class="acm-navbar-actions">
      <label class="sr-only" for="language-select">{{ 'nav.language' | translate }}</label>
      <select
        id="language-select"
        (change)="changeLanguage($any($event.target).value)"
        class="acm-language"
      >
        @for (lang of languages; track lang.code) {
          <option
            [value]="lang.code"
            [selected]="lang.code === currentLanguage"
            [attr.aria-label]="lang.name"
          >
            {{ lang.flag }}
          </option>
        }
      </select>
      @if (auth.can('settings.manage')) {
        <a
          routerLink="/setting"
          class="acm-btn acm-btn--ghost acm-btn--icon"
          [attr.aria-label]="'nav.settings' | translate"
          (click)="isShowUserMenu = false"
        >
          <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="m9.5 3-.6 2.3-2 .9-2.2-.7-2.5 4.3 1.7 1.6v2.3l-1.7 1.6 2.5 4.3 2.2-.7 2 .9.6 2.2h5l.6-2.2 2-.9 2.2.7 2.5-4.3-1.7-1.6v-2.3l1.7-1.6-2.5-4.3-2.2.7-2-.9L14.5 3h-5Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </a>
      }
      <button
        z-button
        zType="ghost"
        zSize="icon"
        type="button"
        (click)="toggleUserMenu()"
        class="acm-btn acm-btn--ghost acm-btn--icon acm-user-trigger"
        id="user-menu-button"
        [attr.aria-expanded]="isShowUserMenu"
        aria-controls="user-dropdown"
      >
        <span class="sr-only">{{ 'nav.openUserMenu' | translate }}</span>
        <img [src]="getfileUrl('user.png')" alt="" />
      </button>
      <button
        z-button
        zType="outline"
        zSize="icon"
        type="button"
        class="acm-btn acm-btn--outline acm-btn--icon acm-mobile-toggle"
        (click)="mobileMenuOpen = !mobileMenuOpen"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-controls="main-menu"
      >
        <span class="sr-only">{{ 'nav.openMainMenu' | translate }}</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    @if (isShowUserMenu) {
      <div class="acm-user-menu" id="user-dropdown">
        <div class="acm-user-details">
          @if (user) {
            <strong>{{ auth.user?.username }}</strong
            ><span>{{ auth.user?.email }}</span>
          }
        </div>
        @if (auth.can('profile.edit')) {
          <a routerLink="/my-profile" (click)="isShowUserMenu = false">{{
            'nav.myProfile' | translate
          }}</a>
        }
        <button
          z-button
          zSize="sm"
          zType="link"
          type="button"
          (click)="logout()"
          class="acm-btn acm-btn--link-danger acm-btn--sm"
        >
          {{ 'nav.signOut' | translate }}
        </button>
      </div>
    }
  </div>
</nav>
