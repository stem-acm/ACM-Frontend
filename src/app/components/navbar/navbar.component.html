<nav class="acm-navbar" aria-label="Main navigation">
  <div class="acm-navbar-inner">
    <a routerLink="/" class="acm-brand" aria-label="American Corner Mahajanga home"
      ><app-acm-logo
    /></a>
    <app-flex-menus
      class="acm-nav-links"
      [mobileOpen]="mobileMenuOpen"
      (click)="mobileMenuOpen = false"
    />
    <div class="acm-navbar-actions">
      <label class="sr-only" for="language-select">{{ 'nav.language' | translate }}</label>
      <select
        id="language-select"
        [value]="currentLanguage"
        (change)="changeLanguage($any($event.target).value)"
        class="acm-language"
      >
        @for (lang of languages; track lang.code) {
          <option [value]="lang.code">{{ lang.name }}</option>
        }
      </select>
      <button
        z-button
        zType="ghost"
        zSize="icon"
        type="button"
        (click)="toggleUserMenu()"
        class="acm-btn acm-btn--ghost acm-btn--icon acm-user-trigger"
        id="user-menu-button"
        [attr.aria-expanded]="isShowUserMenu"
        aria-controls="user-dropdown"
      >
        <span class="sr-only">{{ 'nav.openUserMenu' | translate }}</span>
        <img [src]="getfileUrl('user.png')" alt="" />
      </button>
      <button
        z-button
        zType="outline"
        zSize="icon"
        type="button"
        class="acm-btn acm-btn--outline acm-btn--icon acm-mobile-toggle"
        (click)="mobileMenuOpen = !mobileMenuOpen"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-controls="main-menu"
      >
        <span class="sr-only">{{ 'nav.openMainMenu' | translate }}</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    @if (isShowUserMenu) {
      <div class="acm-user-menu" id="user-dropdown">
        <div class="acm-user-details">
          @if (user) {
            <strong>{{ user.username }}</strong
            ><span>{{ user.email }}</span>
          }
        </div>
        @if (showExperimentalFeatures) {
          <a routerLink="/setting" (click)="isShowUserMenu = false">{{
            'nav.settings' | translate
          }}</a>
          <a routerLink="/user" (click)="isShowUserMenu = false">{{
            'nav.manageIntern' | translate
          }}</a>
        }
        <button
          z-button
          zSize="sm"
          zType="link"
          type="button"
          (click)="logout()"
          class="acm-btn acm-btn--link-danger acm-btn--sm"
        >
          {{ 'nav.signOut' | translate }}
        </button>
      </div>
    }
  </div>
</nav>
