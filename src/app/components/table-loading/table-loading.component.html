<span class="sr-only" role="status">{{ data.textLoading | translate }}</span>
<table
  z-table
  zSize="comfortable"
  class="acm-data-table"
  aria-busy="true"
  [attr.aria-label]="data.textLoading | translate"
>
  <thead z-table-header>
    <tr z-table-row>
      @for (item of data.columns; track $index) {
        <th z-table-head scope="col">{{ item | translate }}</th>
      }
    </tr>
  </thead>
  <tbody z-table-body aria-hidden="true">
    @for (row of rows; track row) {
      <tr z-table-row>
        @for (column of data.columns; track $index) {
          <td z-table-cell>
            <span
              class="block h-4 w-3/4 min-w-8 rounded bg-gray-200 dark:bg-gray-700 motion-safe:animate-pulse"
              >&nbsp;</span
            >
          </td>
        }
      </tr>
    }
  </tbody>
</table>
