<main class="acm-auth-page">
  <div class="acm-auth-intro">
    <span class="acm-auth-eyebrow">American Corner Mahajanga</span>
    <img src="/acm_logo.png" alt="American Corner Mahajanga" />
    <h1>{{ 'pages.authentification' | translate }}</h1>
    <p>{{ 'pages.welcomeWorkspace' | translate }}</p>
  </div>
  <z-card class="acm-auth-card">
    <form (ngSubmit)="validate()" class="acm-auth-form">
      <div>
        <label for="username">{{ 'forms.username' | translate }}</label>
        <input
          z-input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          required
        />
      </div>
      <div>
        <div class="acm-auth-label-row">
          <label for="password">{{ 'forms.password' | translate }}</label>
          @if (showExperimentalFeatures) {
            <a>{{ 'buttons.forgotPassword' | translate }}</a>
          }
        </div>
        <div class="acm-password-field">
          <input
            z-input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button
            z-button
            zSize="icon"
            zType="ghost"
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            class="acm-btn acm-btn--ghost acm-btn--icon acm-password-toggle"
          >
            <img
              [src]="showPassword ? '/eye-off-svgrepo-com.svg' : '/eye-show-svgrepo-com.svg'"
              alt=""
            />
          </button>
        </div>
        @if (error.enabled) {
          <p class="acm-form-error" role="alert">{{ error.message }}</p>
        }
      </div>
      <button
        z-button
        type="submit"
        class="acm-btn acm-btn--primary acm-auth-submit"
        [disabled]="loading"
        [zLoading]="loading"
      >
        {{ loading ? ('loading.verification' | translate) : ('buttons.login' | translate) }}
      </button>
    </form>
  </z-card>
  <span class="acm-auth-footer">{{ 'pages.brandTagline' | translate }}</span>
</main>
